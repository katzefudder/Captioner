[project]
name = "captioner"
version = "0.1.0"
description = "Fotos sichten, bewerten und beschriften, vor dem Import in Lightroom (ADR 0001)"
authors = [
    {name = "Florian Dehn",email = "flo@katzefudder.de"}
]
readme = "readme.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pyside6 (>=6.7,<7.0)",
    "pillow (>=11.0,<12.0)",
    "platformdirs (>=4.0,<5.0)",
    "tomli-w (>=1.0,<2.0)"
]

[project.scripts]
captioner = "captioner.__main__:main"

[tool.poetry]
packages = [{include = "captioner"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pyinstaller = "^6.11"
