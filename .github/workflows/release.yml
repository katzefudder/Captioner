# On every push to main, builds the macOS app (arm64) and the Windows version (x64), tests
# both and publishes DMG, PKG and setup.exe as one GitHub release. Version number:
# <major>.<minor> from pyproject.toml plus the workflow's running number, e.g. 0.1.17
# (tag v0.1.17). The build jobs write it into their pyproject.toml before building
# (scripts/set_version.py), so package metadata and tests see it too; not into the repo.
#
# Pull requests and other branches (started by hand) only build and test; publishing
# happens from main only.
name: Release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.gitignore', '.github/dependabot.yml']
  pull_request:
    paths-ignore: ['**.md', '.gitignore']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Versionsnummer
        id: version
        run: |
          base=$(python3 -c "import tomllib; v = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; print('.'.join(v.split('.')[:2]))")
          version="$base.${{ github.run_number }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Captioner $version"

  macos:
    needs: version
    # Apple silicon; PySide6 6.12 requires macOS 26 anyway (see Claude.md, packaging)
    runs-on: macos-26
    env:
      QT_QPA_PLATFORM: offscreen
      CAPTIONER_VERSION: ${{ needs.version.outputs.version }}
    outputs:
      min_os: ${{ steps.min_os.outputs.min_os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.11'

      # release version in pyproject.toml, only in this working copy (not back into the repo)
      - run: python scripts/set_version.py

      - name: Poetry und ExifTool
        run: |
          pipx install poetry
          brew install exiftool

      - name: Poetry-Venv aus dem Cache
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Gebuendeltes ExifTool aus dem Cache
        uses: actions/cache@v6
        with:
          path: vendor/exiftool
          key: exiftool-${{ hashFiles('Makefile') }}

      - run: make install
      - run: make test
      - run: make installer

      - name: Mindest-macOS
        id: min_os
        run: echo "min_os=$(plutil -extract LSMinimumSystemVersion raw dist/Captioner.app/Contents/Info.plist)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            dist/Captioner-${{ env.CAPTIONER_VERSION }}-arm64.dmg
            dist/Captioner-${{ env.CAPTIONER_VERSION }}-arm64.pkg
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      CAPTIONER_VERSION: ${{ needs.version.outputs.version }}
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.11'

      - run: python scripts/set_version.py

      - name: Poetry
        run: pipx install poetry

      - name: Poetry-Venv aus dem Cache
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Gebuendeltes ExifTool aus dem Cache
        uses: actions/cache@v6
        with:
          path: vendor/exiftool-windows
          key: exiftool-windows-${{ hashFiles('scripts/package_windows.py') }}

      - run: poetry install

      # the same ExifTool that gets bundled, for the tests too (on the PATH)
      - name: ExifTool
        run: |
          poetry run python scripts/package_windows.py exiftool
          "$PWD\vendor\exiftool-windows" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - run: poetry run python -m pytest

      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - run: poetry run python scripts/package_windows.py all

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/Captioner-${{ env.CAPTIONER_VERSION }}-x64-setup.exe
          if-no-files-found: error

  release:
    needs: [version, macos, windows]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # only the change list; before the download, because checkout empties the work folder
      - uses: actions/checkout@v7
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Release veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          MIN_OS: ${{ needs.macos.outputs.min_os }}
        run: |
          # section "## <major>.<minor>" from CHANGELOG.md, then the installation notes
          awk -v v="${VERSION%.*}" '/^## / { p = ($2 == v); next } p' CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          **macOS:** Mac mit Apple Silicon, macOS $MIN_OS oder neuer (DMG oder PKG). Ad-hoc signiert: nach dem Download einmal Systemeinstellungen → Datenschutz & Sicherheit → „Dennoch öffnen“, oder \`xattr -dr com.apple.quarantine /Applications/Captioner.app\`.

          **Windows:** Windows 10/11, 64 Bit (\`Captioner-$VERSION-x64-setup.exe\`). Unsigniert: SmartScreen warnt beim ersten Start → „Weitere Informationen“ → „Trotzdem ausführen“.
          EOF
          gh release create "v$VERSION" \
            dist/Captioner-$VERSION-arm64.dmg \
            dist/Captioner-$VERSION-arm64.pkg \
            dist/Captioner-$VERSION-x64-setup.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Captioner $VERSION" \
            --generate-notes \
            --notes-file notes.md
