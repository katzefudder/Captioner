# Dependabot: weekly updates as pull requests. Every PR runs through release.yml
# (tests and build on macOS and Windows), publishing only happens after the merge to main.
#
# Not covered: ExifTool (version/checksum in the Makefile and in
# scripts/package_windows.py) - update by hand from exiftool.org/ver.txt.
version: 2
updates:
  # Python dependencies from pyproject.toml / poetry.lock
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      # small updates collected in one PR, so five builds don't run every week
      kleine-updates:
        update-types: [minor, patch]
        exclude-patterns: [pyside6, shiboken6, pyinstaller]
      # PySide6 and PyInstaller separately: they can raise the minimum macOS or change
      # the bundle (Claude.md, packaging: after an update check otool -L / UNUSED)
    ignore:
      # pyproject.toml excludes major versions anyway (pyside6 <7 etc.)
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # versions of the actions in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
